name: Daily RAG Knowledge Base Update

on:
  schedule:
    # 10:00 AM IST is 04:30 AM UTC
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  ingest-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Data Ingestion Pipeline
        run: |
          echo "Removing existing local ChromaDB to force a fresh ingestion..."
          rm -rf chroma_db_v8
          echo "Running vector_store.py to fetch sources and build the vector index..."
          python vector_store.py
          
      - name: Commit and Push Updated Index
        run: |
          echo "Configuring git for GitHub Actions bot..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add the database directory since it is in .gitignore
          git add -f chroma_db_v8/
          
          # Check if there are changes and commit
          if ! git diff --staged --quiet; then
            echo "Changes detected in ChromaDB. Committing and pushing..."
            git commit -m "chore: Daily RAG knowledge base refresh [skip ci]"
            git push origin master
          else
            echo "No changes detected in ChromaDB. Skipping commit."
          fi
